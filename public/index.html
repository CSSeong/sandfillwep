<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>FILL — Sand simulation</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fff; color: #555; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: #fff; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
    .instructions { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; color: #555; opacity: .42; pointer-events: none; animation: fade-away 1s ease 9s forwards; }
    .instructions h1 { margin: 0 0 18px; font-size: clamp(24px, 4vw, 36px); font-weight: 400; letter-spacing: -.04em; }
    .instructions p { margin: 0; font-size: 13px; line-height: 2; }
    .instructions small { margin-top: 16px; font-size: 11px; }
    .instructions[hidden] { display: none; }
    @keyframes fade-away { to { opacity: 0; visibility: hidden; } }
    .tools { position: fixed; top: max(18px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 14px; max-width: calc(100% - 36px); padding: 10px 12px; background: rgb(255 255 255 / 85%); border-radius: 12px; }
    .palette { display: flex; gap: 8px; }
    button { font: inherit; cursor: pointer; touch-action: manipulation; }
    .palette button { width: 19px; height: 19px; padding: 0; border: 2px solid #fff; border-radius: 50%; background: var(--swatch); }
    .palette button[aria-pressed="true"] { outline: 1px solid #888; outline-offset: 2px; }
    .brush { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #999; white-space: nowrap; }
    .brush input { width: 64px; flex-shrink: 0; accent-color: #b6a07a; }
    .brush output { width: 10px; }
    .particle-size output { width: 30px; }
    .actions { display: flex; gap: 6px; }
    .actions button { width: 30px; height: 30px; padding: 0; color: #888; background: #fff; border: 1px solid #eee; border-radius: 6px; }
    .actions button:hover { color: #444; border-color: #ccc; }
    button:focus-visible, input:focus-visible { outline: 2px solid #8b7758; outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 480px) { .tools { top: max(10px, env(safe-area-inset-top)); right: 10px; display: grid; grid-template-columns: auto auto; gap: 10px; padding: 8px; max-width: calc(100% - 20px); } .palette { gap: 6px; grid-column: 1; grid-row: 1; } .actions { grid-column: 2; grid-row: 1; justify-content: flex-end; } }
    @media (prefers-reduced-motion: reduce) { .instructions { animation: none; } }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="누르거나 드래그하여 모래를 뿌리는 시뮬레이션" aria-describedby="hint"></canvas>
  <div class="instructions" id="hint">
    <h1>모래를 흘려보세요.</h1>
    <p>화면을 누르거나 드래그하면 모래가 쌓입니다.<br>색상과 붓·입자 크기를 바꿔 나만의 풍경을 만들어보세요.</p>
    <small>P · 일시정지 / 계속하기 &nbsp;&nbsp; R · 비우기</small>
  </div>
  <div class="tools" role="group" aria-label="모래 조작 도구">
    <div class="palette" role="group" aria-label="모래 색상">
      <button data-color="1" style="--swatch:#a7bd86" aria-label="연두색 모래" aria-pressed="false" title="연두색 모래"></button>
      <button data-color="2" style="--swatch:#d79667" aria-label="주황색 모래" aria-pressed="false" title="주황색 모래"></button>
      <button data-color="3" style="--swatch:#969ecc" aria-label="보라색 모래" aria-pressed="false" title="보라색 모래"></button>
      <button data-color="4" style="--swatch:#d395ae" aria-label="분홍색 모래" aria-pressed="false" title="분홍색 모래"></button>
      <button data-color="5" style="--swatch:#d1b176" aria-label="모래색 모래" aria-pressed="true" title="모래색 모래"></button>
    </div>
    <label class="brush" for="brush"><span>붓</span><input id="brush" aria-label="붓 크기" type="range" min="1" max="8" value="3"><output id="size" for="brush">3</output></label>
    <label class="brush particle-size" for="particle-size"><span>입자</span><input id="particle-size" aria-label="모래 입자 크기" type="range" min="2" max="12" step="1" value="2"><output id="particle-size-value" for="particle-size">2px</output></label>
    <div class="actions">
      <button id="pause" aria-label="일시정지" title="일시정지 (P)" aria-pressed="false">Ⅱ</button>
      <button id="reset" aria-label="모래 비우기" title="모래 비우기 (R)">↻</button>
    </div>
  </div>
  <span class="sr-only">모래 알갱이 <output id="count">0</output>개 · <span id="status">FLOWING</span></span>
  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const el = id => document.getElementById(id);
      const baseColors = ['#a7bd86', '#d79667', '#969ecc', '#d395ae', '#d1b176'];
      const SHADE_COUNT = 17;
      // Store a shade with each grain, so its brightness stays fixed as it moves.
      const paletteBytes = new Uint8ClampedArray((baseColors.length * SHADE_COUNT + 1) * 4);
      paletteBytes.set([255, 255, 255, 255]);
      baseColors.forEach((hex, colorIndex) => {
        const rgb = [1, 3, 5].map(offset => parseInt(hex.slice(offset, offset + 2), 16));
        for (let shade = 0; shade < SHADE_COUNT; shade++) {
          const brightness = .88 + shade / (SHADE_COUNT - 1) * .24;
          paletteBytes.set([...rgb.map(channel => Math.min(255, Math.round(channel * brightness))), 255],
            (colorIndex * SHADE_COUNT + shade + 1) * 4);
        }
      });
      // Reading palette and image bytes through the same view also works on big-endian devices.
      const packedColors = new Uint32Array(paletteBytes.buffer);
      let W = 0, H = 0, S = 2, grid = new Uint8Array(0);
      let activeMin, activeMax, scanMin, scanMax, activeRows = 0;
      let imageData, pixels, dirtyFlags, dirtyCells, dirtyCount = 0;
      let color = 5, brush = 3, paused = false, pointer = null, pointerId = null, last = 0, count = 0;
      let frameId = 0, sizeFrameId = 0, renderedCount = -1;
      const STEP_MS = 1000 / 40;

      function resetActivity() {
        activeMin.fill(W); activeMax.fill(-1);
        scanMin.fill(W); scanMax.fill(-1);
        activeRows = 0;
      }

      function wakeRange(y, left, right) {
        if (y < 0 || y >= H) return;
        left = Math.max(0, left); right = Math.min(W - 1, right);
        if (activeMin[y] === W) activeRows++;
        if (left < activeMin[y]) activeMin[y] = left;
        if (right > activeMax[y]) activeMax[y] = right;
      }

      function markDirty(i) {
        if (!dirtyFlags[i]) { dirtyFlags[i] = 1; dirtyCells[dirtyCount++] = i; }
      }

      function stopFrame() {
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0; last = 0;
      }

      function scheduleFrame() {
        if (!frameId && !paused && (pointer || activeRows)) frameId = requestAnimationFrame(loop);
      }

      function resize() {
        if (sizeFrameId) cancelAnimationFrame(sizeFrameId);
        sizeFrameId = 0;
        stopFrame();
        const width = window.innerWidth, height = window.innerHeight;
        const minimumSize = Math.max(2, Math.ceil(Math.sqrt(width * height / 300000)));
        const control = el('particle-size');
        const size = Math.min(Math.max(12, minimumSize), Math.max(minimumSize, Math.round(Number(control.value) || minimumSize)));
        control.min = String(minimumSize);
        control.max = String(Math.max(12, minimumSize));
        control.value = String(size);
        el('particle-size-value').textContent = `${size}px`;
        const newW = Math.ceil(width / size), newH = Math.ceil(height / size);
        const next = new Uint8Array(newW * newH);
        const dx = Math.floor((newW - W) / 2), dy = newH - H;
        count = 0;
        if (W && size !== S) {
          // Keep grains near their screen position, stacking colliding grains upward.
          const freeTop = new Int32Array(newW).fill(newH - 1), overflow = [];
          for (let y = H - 1; y >= 0; y--) for (let x = 0; x < W; x++) {
            const grain = grid[y * W + x];
            if (!grain) continue;
            const xx = Math.max(0, Math.min(newW - 1, Math.floor((x - W / 2) * S / size + newW / 2)));
            const yy = Math.min(freeTop[xx], newH - 1 - Math.floor((H - 1 - y) * S / size));
            if (yy < 0) { overflow.push(grain); continue; }
            next[yy * newW + xx] = grain;
            freeTop[xx] = yy - 1;
            count++;
          }
          // Reuse free cells before discarding grains that cannot fit at the larger size.
          for (let i = next.length - 1; i >= 0 && overflow.length; i--) if (!next[i]) {
            next[i] = overflow.pop(); count++;
          }
        } else {
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const grain = grid[y * W + x], xx = x + dx, yy = y + dy;
            if (grain && xx >= 0 && xx < newW && yy >= 0 && yy < newH) {
              next[yy * newW + xx] = grain;
              count++;
            }
          }
        }
        W = newW; H = newH; S = size; grid = next;
        // One canvas pixel per grain; CSS scales it to the same visible grain size.
        canvas.width = W; canvas.height = H;
        imageData = ctx.createImageData(W, H);
        pixels = new Uint32Array(imageData.data.buffer);
        dirtyFlags = new Uint8Array(W * H);
        dirtyCells = new Uint32Array(W * H);
        dirtyCount = 0;
        activeMin = new Int32Array(H); activeMax = new Int32Array(H);
        scanMin = new Int32Array(H); scanMax = new Int32Array(H);
        resetActivity();
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          if (grid[y * W + x]) wakeRange(y, x, x);
        }
        pointer = null; pointerId = null;
        draw(true);
        scheduleFrame();
      }

      function sprinkle() {
        if (!pointer) return;
        const [cx, cy] = pointer;
        for (let y = -brush; y <= brush; y++) for (let x = -brush; x <= brush; x++) {
          if (x * x + y * y > brush * brush || Math.random() > .55) continue;
          const xx = cx + x, yy = cy + y;
          if (xx >= 0 && xx < W && yy >= 0 && yy < H && !grid[yy * W + xx]) {
            const i = yy * W + xx;
            grid[i] = (color - 1) * SHADE_COUNT + Math.floor(Math.random() * SHADE_COUNT) + 1;
            markDirty(i);
            wakeRange(yy, xx, xx);
            count++;
          }
        }
      }

      function step() {
        if (!activeRows) return;
        // Double-buffer row ranges: sleeping grains only wake when their support changes.
        [activeMin, scanMin] = [scanMin, activeMin];
        [activeMax, scanMax] = [scanMax, activeMax];
        activeRows = 0;
        for (let y = H - 1; y >= 0; y--) {
          const left = scanMin[y], right = scanMax[y];
          scanMin[y] = W; scanMax[y] = -1;
          if (left > right || y === H - 1) continue;
          const reverse = Math.random() < .5;
          for (let k = left; k <= right; k++) {
            const x = reverse ? right - (k - left) : k, i = y * W + x;
            if (!grid[i]) continue;
            let target = -1;
            if (!grid[i + W]) target = i + W;
            else {
              const canLeft = x > 0 && !grid[i + W - 1];
              const canRight = x < W - 1 && !grid[i + W + 1];
              if (canLeft && canRight) target = i + W + (Math.random() < .5 ? -1 : 1);
              else if (canLeft) target = i + W - 1;
              else if (canRight) target = i + W + 1;
            }
            if (target >= 0) {
              grid[target] = grid[i]; grid[i] = 0;
              markDirty(i); markDirty(target);
              wakeRange(y + 1, target % W, target % W);
              wakeRange(y - 1, x - 1, x + 1);
            }
          }
        }
      }

      function draw(full = false) {
        if (full) {
          for (let i = 0; i < grid.length; i++) pixels[i] = packedColors[grid[i]];
          ctx.putImageData(imageData, 0, 0);
          dirtyFlags.fill(0); dirtyCount = 0;
        } else if (dirtyCount) {
          let left = W, top = H, right = 0, bottom = 0;
          for (let n = 0; n < dirtyCount; n++) {
            const i = dirtyCells[n], x = i % W, y = Math.floor(i / W);
            pixels[i] = packedColors[grid[i]];
            dirtyFlags[i] = 0;
            if (x < left) left = x;
            if (x > right) right = x;
            if (y < top) top = y;
            if (y > bottom) bottom = y;
          }
          ctx.putImageData(imageData, 0, 0, left, top, right - left + 1, bottom - top + 1);
          dirtyCount = 0;
        }
        if (renderedCount !== count) { el('count').textContent = String(count); renderedCount = count; }
      }

      function position(e) {
        const r = canvas.getBoundingClientRect();
        return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)];
      }
      canvas.addEventListener('pointerdown', e => {
        if (e.button !== 0 || !e.isPrimary) return;
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        pointerId = e.pointerId;
        pointer = position(e);
        if (!paused) { sprinkle(); draw(); scheduleFrame(); }
      });
      canvas.addEventListener('pointermove', e => {
        if (pointer && e.pointerId === pointerId) pointer = position(e);
      });
      for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        canvas.addEventListener(event, e => {
          if (e.pointerId === pointerId) { pointer = null; pointerId = null; }
        });
      }

      function pause() {
        paused = !paused;
        pointer = null;
        stopFrame();
        if (!paused) scheduleFrame();
        el('pause').textContent = paused ? '▶' : 'Ⅱ';
        const label = paused ? '계속하기' : '일시정지';
        el('pause').setAttribute('aria-label', label);
        el('pause').setAttribute('aria-pressed', String(paused));
        el('pause').title = `${label} (P)`;
        el('status').textContent = paused ? 'PAUSED' : 'FLOWING';
      }
      function clear() {
        stopFrame();
        grid.fill(0); resetActivity(); count = 0; pointer = null; pointerId = null;
        draw(true);
      }
      el('pause').onclick = pause;
      el('reset').onclick = clear;
      el('brush').oninput = e => { brush = Number(e.target.value); el('size').textContent = brush; };
      el('particle-size').oninput = e => {
        el('particle-size-value').textContent = `${e.target.value}px`;
        // Rebuild at most once per display frame while dragging the slider.
        if (!sizeFrameId) sizeFrameId = requestAnimationFrame(() => { sizeFrameId = 0; resize(); });
      };
      document.querySelectorAll('[data-color]').forEach(button => button.onclick = () => {
        color = Number(button.dataset.color);
        document.querySelectorAll('[data-color]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
      });
      window.addEventListener('keydown', e => {
        if (e.target instanceof HTMLInputElement) return;
        if (e.code === 'KeyP') { e.preventDefault(); pause(); }
        if (e.code === 'KeyR') { e.preventDefault(); clear(); }
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) pause(); });
      window.addEventListener('resize', resize);
      // Let the one-second fade finish at ten seconds; clearing sand does not restart it.
      setTimeout(() => { el('hint').hidden = true; }, 10000);
      function loop(now) {
        frameId = 0;
        if (paused) return;
        if (!last) last = now - STEP_MS;
        const ticks = Math.min(3, Math.floor((now - last) / STEP_MS));
        if (ticks) {
          last = now - (now - last) % STEP_MS;
          for (let n = 0; n < ticks; n++) { sprinkle(); step(); step(); }
          draw();
        }
        if (pointer || activeRows) scheduleFrame();
        else last = 0;
      }
      resize();
    })();
  </script>
</body>
</html>
